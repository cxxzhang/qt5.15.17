name: Prepare requested Linux baselines
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [all, native, native-inputs, cross, loongarch, loongarch-oldworld, loongarch-oldworld-deps, loongarch-newworld, loongarch-newworld-deps, mips, mips-deps]
        default: all
permissions:
  contents: read
jobs:
  check-cache-release:
    runs-on: ubuntu-22.04
    steps:
    - name: Verify the dedicated reusable toolchain cache release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        test "$(gh api "repos/$GH_REPO/releases/tags/linux-toolchains-v1" --jq .tag_name)" = linux-toolchains-v1
  native-inputs:
    if: inputs.target == 'native-inputs'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    env:
      TARGET: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v4
    - name: Inspect the pinned native SDK build environment
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        image=$(python3 -c 'import json,os; print(json.load(open("scripts/linux-baseline/targets.json"))["targets"][os.environ["TARGET"]]["image"])')
        docker run --rm "$image" bash -ec '
          getconf GNU_LIBC_VERSION
          for compiler in /usr/bin/gcc /usr/bin/g++ "$(command -v gcc)" "$(command -v g++)"; do
            if test -x "$compiler"; then
              echo "GNU COMPILER: $compiler"
              "$compiler" --version
              "$compiler" -dumpmachine
              "$compiler" -print-file-name=libstdc++.so.6
              "$compiler" -print-libgcc-file-name
              "$compiler" -print-search-dirs
              rpm -qf "$compiler" || true
            fi
          done
          find /usr/include/c++ /opt/rh -name c++config.h -o -name libstdc++.so.6 2>/dev/null || true
          rpm -qa | sort
          command -v patchelf
          pkg-config --list-all | sort
          for name in freetype2 fontconfig x11 xcb xcb-renderutil xcb-icccm xkbcommon wayland-client wayland-server gl egl; do
            printf "DEPENDENCY %s: " "$name"
            pkg-config --modversion "$name" || true
          done
        ' 2>&1 | tee build-temp/logs/native-environment.log
    - name: Prepare missing Qt dependencies on the baseline
      run: |
        set -o pipefail
        image=$(python3 -c 'import json,os; print(json.load(open("scripts/linux-baseline/targets.json"))["targets"][os.environ["TARGET"]]["image"])')
        docker run --rm -v "$PWD:/workspace" -w /workspace "$image" bash scripts/linux-baseline/prepare-native-deps.sh "$TARGET" \
          2>&1 | tee build-temp/logs/native-qt-dependencies.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-native-environment-${{ matrix.arch }}
        path: build-temp/logs/
  native:
    needs: check-cache-release
    if: inputs.target == 'all' || inputs.target == 'native'
    name: glibc 2.17 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: ubuntu-22.04
        - arch: arm64
          runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache/restore@v4
      id: baseline-cache
      with:
        path: build-temp/baseline-${{ matrix.arch }}
        key: baseline-217-${{ matrix.arch }}-${{ hashFiles('scripts/linux-baseline/prepare-native.sh', 'scripts/linux-baseline/probe-mixed-cxx.sh', 'scripts/linux-baseline/package-native.sh', 'scripts/linux-baseline/prepare-native-deps.sh', 'scripts/linux-baseline/targets.json') }}
        restore-keys: baseline-217-${{ matrix.arch }}-
    - name: Prepare and execute the native baseline probe
      env:
        TARGET: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        image=$(python3 -c 'import json,os; print(json.load(open("scripts/linux-baseline/targets.json"))["targets"][os.environ["TARGET"]]["image"])')
        docker pull "$image"
        pinned=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
        printf '%s\n' "$pinned" >"build-temp/logs/$TARGET-image.txt"
        docker run --rm -e GITHUB_TOKEN -v "$PWD:/workspace" -w /workspace "$pinned" \
          bash scripts/linux-baseline/prepare-native.sh "$TARGET" \
          2>&1 | tee "build-temp/logs/$TARGET-217-toolchain.log"
        docker run --rm -v "$PWD:/workspace" -w /workspace "$pinned" \
          bash -ec 'export PATH=/opt/python/cp311-cp311/bin:$PATH; bash scripts/linux-baseline/prepare-native-deps.sh "$1"; bash scripts/linux-baseline/package-native.sh "$1"' _ "$TARGET" \
          2>&1 | tee "build-temp/logs/$TARGET-217-packaging.log"
    - uses: actions/cache/save@v4
      if: always() && steps.baseline-cache.outputs.cache-hit != 'true' && hashFiles(format('build-temp/baseline-{0}/gcc/.ready', matrix.arch)) != ''
      with:
        path: build-temp/baseline-${{ matrix.arch }}
        key: ${{ steps.baseline-cache.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      with:
        name: native-toolchain-${{ matrix.arch }}
        compression-level: 0
        path: Output/toolchains/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-baseline-217-${{ matrix.arch }}
        path: build-temp/logs/
  publish-native:
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: native-toolchain-*
        merge-multiple: true
        path: toolchains
    - name: Release the accepted native toolchains
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        (cd toolchains && cat *.sha256 | sha256sum -c -)
        python3 scripts/linux-baseline/publish-cache.py toolchains --source-commit "$COMMIT" --source-run "$RUN_ID" --output published-native-toolchains.json
    - uses: actions/upload-artifact@v4
      with:
        name: published-native-toolchains
        path: published-native-toolchains.json
  mips:
    needs: check-cache-release
    if: inputs.target == 'all' || inputs.target == 'cross' || inputs.target == 'mips' || inputs.target == 'mips-deps'
    name: Build MIPS64EL glibc 2.17 sysroot
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache/restore@v4
      id: mips-cache
      with:
        path: build-temp/baseline-mips64el
        key: mips217-gnu-${{ hashFiles('scripts/linux-baseline/prepare-mips.sh') }}
    - uses: actions/cache/restore@v4
      id: mips-downloads
      with:
        path: build-temp/baseline-downloads
        key: baseline-gnu-downloads-${{ hashFiles('scripts/linux-baseline/prepare-mips.sh') }}
        restore-keys: baseline-gnu-downloads-
    - name: Build the pinned source toolchain
      if: steps.mips-cache.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        bash scripts/linux-baseline/prepare-mips.sh 2>&1 | tee build-temp/logs/mips217-toolchain.log
    - uses: actions/cache/save@v4
      if: always() && steps.mips-downloads.outputs.cache-hit != 'true'
      with:
        path: build-temp/baseline-downloads
        key: ${{ steps.mips-downloads.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: steps.mips-cache.outputs.cache-hit != 'true'
      with:
        path: build-temp/baseline-mips64el
        key: ${{ steps.mips-cache.outputs.cache-primary-key }}
    - uses: actions/cache/restore@v4
      id: mips-vendor
      with:
        path: build-temp/loong-newworld-inputs/downloads
        key: mips-upstream-clang-${{ hashFiles('scripts/linux-baseline/load-upstream-clang.sh') }}
        restore-keys: loong-newworld-inputs-
    - name: Execute Clang C++20 on MIPS glibc 2.17
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        bash scripts/linux-baseline/probe-mips.sh 2>&1 | tee build-temp/logs/mips217-probe.log
    - uses: actions/cache/save@v4
      if: always() && steps.mips-vendor.outputs.cache-hit != 'true'
      with:
        path: build-temp/loong-newworld-inputs/downloads
        key: ${{ steps.mips-vendor.outputs.cache-primary-key }}
    - uses: actions/cache/restore@v4
      if: inputs.target == 'mips-deps'
      id: mips-graphics
      with:
        path: build-temp/baseline-mips64el/graphics-inputs
        key: mips-graphics-inputs-${{ hashFiles('scripts/linux-baseline/mips-graphics.lock.json') }}
    - name: Audit non-glibc MIPS graphics against the real 2.17 root
      if: inputs.target == 'mips-deps'
      run: |
        set -o pipefail
        python3 scripts/linux-baseline/prepare-mips-deps.py 2>&1 | tee build-temp/logs/mips217-graphics.log
    - uses: actions/cache/save@v4
      if: always() && inputs.target == 'mips-deps' && steps.mips-graphics.outputs.cache-hit != 'true'
      with:
        path: build-temp/baseline-mips64el/graphics-inputs
        key: ${{ steps.mips-graphics.outputs.cache-primary-key }}
    - name: Relocate and package the accepted MIPS toolchain
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        bash scripts/linux-baseline/package-cross.sh mips64el 2>&1 | tee build-temp/logs/mips217-packaging.log
    - uses: actions/upload-artifact@v4
      with:
        name: cross-toolchain-mips64el
        compression-level: 0
        path: Output/toolchains/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-baseline-mips217
        path: build-temp/logs/
  loongarch:
    if: inputs.target == 'all' || inputs.target == 'cross' || inputs.target == 'loongarch'
    name: Inspect LoongArch glibc 2.28 ABI inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache/restore@v4
      id: loong-inputs
      with:
        path: build-temp/loong28-inspection/downloads
        key: loong28-vendor-inputs-${{ hashFiles('scripts/linux-baseline/inspect-loongarch.sh') }}
        restore-keys: loong28-vendor-inputs-
    - name: Record compiler ABI modes and libc symbol versions
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        bash scripts/linux-baseline/inspect-loongarch.sh 2>&1 | tee build-temp/logs/loong28-inspection.log
    - uses: actions/cache/save@v4
      if: always() && steps.loong-inputs.outputs.cache-hit != 'true'
      with:
        path: build-temp/loong28-inspection/downloads
        key: ${{ steps.loong-inputs.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-baseline-loong28
        path: build-temp/logs/
  loongarch-oldworld:
    needs: check-cache-release
    if: inputs.target == 'all' || inputs.target == 'cross' || inputs.target == 'loongarch-oldworld' || inputs.target == 'loongarch-oldworld-deps'
    name: Clang C++20 on LoongArch old-world glibc 2.28
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Install host packaging tool
      run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends patchelf
    - uses: actions/cache/restore@v4
      id: oldworld-runtime
      with:
        path: build-temp/baseline-loong64-oldworld
        key: loong-oldworld-228-${{ hashFiles('scripts/linux-baseline/prepare-loongarch-oldworld.sh') }}
        restore-keys: loong-oldworld-228-
    - uses: actions/cache/restore@v4
      id: oldworld-inputs
      with:
        path: build-temp/loong28-inspection/downloads
        key: loong-oldworld-downloads-${{ hashFiles('scripts/linux-baseline/load-vendor-clang.sh') }}
        restore-keys: loong28-vendor-inputs-
    - name: Build and execute the old-world runtime
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        bash scripts/linux-baseline/prepare-loongarch-oldworld.sh 2>&1 | tee build-temp/logs/loong-oldworld-228.log
    - uses: actions/cache/save@v4
      if: always() && steps.oldworld-runtime.outputs.cache-hit != 'true' && hashFiles('build-temp/baseline-loong64-oldworld/runtime/.ready') != ''
      with:
        path: build-temp/baseline-loong64-oldworld
        key: ${{ steps.oldworld-runtime.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: always() && steps.oldworld-inputs.outputs.cache-hit != 'true'
      with:
        path: build-temp/loong28-inspection/downloads
        key: ${{ steps.oldworld-inputs.outputs.cache-primary-key }}
    - uses: actions/cache/restore@v4
      if: inputs.target == 'loongarch-oldworld-deps'
      id: oldworld-graphics
      with:
        path: build-temp/baseline-loong64-oldworld
        key: loong-oldworld-graphics-${{ hashFiles('scripts/build-linux-cross-dependencies.py', 'scripts/linux-baseline/oldworld-graphics.lock.json') }}
        restore-keys: loong-oldworld-graphics-
    - name: Build the missing old-world graphics libraries against glibc 2.28
      if: inputs.target == 'loongarch-oldworld-deps'
      run: |
        set -o pipefail
        cp -a build-temp/loong28-inspection/host-libs build-temp/baseline-loong64-oldworld/
        sudo -E python3 scripts/build-linux-cross-dependencies.py build-temp/baseline-loong64-oldworld \
          --cross build-temp/baseline-loong64-oldworld --sysroot build-temp/baseline-loong64-oldworld/sysroot \
          --llvm build-temp/loong28-inspection/compiler/llvm-toolchain_20.1.8-1_amd64-linux-gnu_debian-10/llvm_install \
          --recipes scripts/linux-baseline/oldworld-graphics.lock.json \
          2>&1 | tee build-temp/logs/loong-oldworld-graphics.log
    - uses: actions/cache/save@v4
      if: always() && inputs.target == 'loongarch-oldworld-deps' && steps.oldworld-graphics.outputs.cache-hit != 'true'
      with:
        path: build-temp/baseline-loong64-oldworld
        key: ${{ steps.oldworld-graphics.outputs.cache-primary-key }}
    - name: Relocate and package the accepted old-world toolchain
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        sudo chown -R "$(id -u):$(id -g)" build-temp/baseline-loong64-oldworld
        bash scripts/linux-baseline/package-cross.sh loong64-oldworld 2>&1 | tee build-temp/logs/loong-oldworld-packaging.log
    - uses: actions/upload-artifact@v4
      with:
        name: cross-toolchain-loong64-oldworld
        compression-level: 0
        path: Output/toolchains/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-baseline-loong-oldworld-228
        path: build-temp/logs/
  publish-cross:
    needs: [loongarch-oldworld, loongarch-newworld, mips]
    if: >-
      ${{ !cancelled() &&
      (inputs.target == 'all' || inputs.target == 'cross' || inputs.target == 'mips' || inputs.target == 'mips-deps' || inputs.target == 'loongarch-oldworld' || inputs.target == 'loongarch-oldworld-deps' || inputs.target == 'loongarch-newworld' || inputs.target == 'loongarch-newworld-deps') &&
      (needs.mips.result == 'success' || needs['loongarch-oldworld'].result == 'success' || needs['loongarch-newworld'].result == 'success') &&
      needs.mips.result != 'failure' && needs['loongarch-oldworld'].result != 'failure' && needs['loongarch-newworld'].result != 'failure' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: cross-toolchain-*
        merge-multiple: true
        path: toolchains
    - name: Release the selected accepted cross toolchains
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        (cd toolchains && cat *.sha256 | sha256sum -c -)
        python3 scripts/linux-baseline/publish-cache.py toolchains --source-commit "$COMMIT" --source-run "$RUN_ID" --output published-cross-toolchains.json
    - uses: actions/upload-artifact@v4
      with:
        name: published-cross-toolchains
        path: published-cross-toolchains.json
  loongarch-newworld:
    needs: check-cache-release
    if: inputs.target == 'all' || inputs.target == 'cross' || inputs.target == 'loongarch-newworld' || inputs.target == 'loongarch-newworld-deps'
    name: Clang C++20 on LoongArch new-world glibc 2.36
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Install host LLVM runtime dependencies
      run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends patchelf libtinfo5 libxml2
    - uses: actions/cache/restore@v4
      id: newworld-runtime
      with:
        path: build-temp/baseline-loong64-newworld
        key: loong-newworld-236-${{ hashFiles('scripts/linux-baseline/prepare-loongarch-oldworld.sh', 'scripts/sysroots/loong64.lock.json') }}
        restore-keys: loong-newworld-236-
    - uses: actions/cache/restore@v4
      id: newworld-inputs
      with:
        path: build-temp/loong-newworld-inputs/downloads
        key: loong-newworld-inputs-${{ hashFiles('scripts/linux-baseline/load-upstream-clang.sh') }}
    - name: Build and execute the new-world runtime
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        bash scripts/linux-baseline/prepare-loongarch-oldworld.sh newworld 2>&1 | tee build-temp/logs/loong-newworld-236.log
    - uses: actions/cache/save@v4
      if: always() && steps.newworld-runtime.outputs.cache-hit != 'true' && hashFiles('build-temp/baseline-loong64-newworld/runtime/.ready') != ''
      with:
        path: build-temp/baseline-loong64-newworld
        key: ${{ steps.newworld-runtime.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: always() && steps.newworld-inputs.outputs.cache-hit != 'true'
      with:
        path: build-temp/loong-newworld-inputs/downloads
        key: ${{ steps.newworld-inputs.outputs.cache-primary-key }}
    - uses: actions/cache/restore@v4
      if: inputs.target == 'loongarch-newworld-deps'
      id: newworld-graphics
      with:
        path: build-temp/baseline-loong64-newworld
        key: loong-newworld-graphics-${{ hashFiles('scripts/build-linux-cross-dependencies.py', 'scripts/sysroots/loong64-sources.lock.json') }}
        restore-keys: loong-newworld-graphics-
    - name: Build the pinned glibc 2.36 graphics dependency sources
      if: inputs.target == 'loongarch-newworld-deps'
      run: |
        set -o pipefail
        sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential pkg-config libexpat1-dev libwayland-dev
        sudo -E python3 scripts/build-linux-cross-dependencies.py build-temp/baseline-loong64-newworld \
          --cross build-temp/baseline-loong64-newworld --sysroot build-temp/baseline-loong64-newworld/sysroot-loong64 \
          --llvm build-temp/loong-newworld-inputs/compiler \
          2>&1 | tee build-temp/logs/loong-newworld-graphics.log
    - uses: actions/cache/save@v4
      if: always() && inputs.target == 'loongarch-newworld-deps' && steps.newworld-graphics.outputs.cache-hit != 'true'
      with:
        path: build-temp/baseline-loong64-newworld
        key: ${{ steps.newworld-graphics.outputs.cache-primary-key }}
    - name: Relocate and package the accepted new-world toolchain
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        # The dependency installer runs as root; packaging rewrites host .pc files.
        sudo chown -R "$(id -u):$(id -g)" build-temp/baseline-loong64-newworld
        bash scripts/linux-baseline/package-cross.sh loong64-newworld 2>&1 | tee build-temp/logs/loong-newworld-packaging.log
    - uses: actions/upload-artifact@v4
      with:
        name: cross-toolchain-loong64-newworld
        compression-level: 0
        path: Output/toolchains/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-baseline-loong-newworld-236
        path: build-temp/logs/
