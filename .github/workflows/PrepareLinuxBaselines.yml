name: Prepare requested Linux baselines
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [all, native, native-inputs, cross, loongarch, loongarch-oldworld, mips]
        default: all
permissions:
  contents: read
jobs:
  native-inputs:
    if: inputs.target == 'native-inputs'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Inspect the pinned native SDK build environment
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        image=$(python3 -c 'import json; print(json.load(open("scripts/linux-baseline/targets.json"))["targets"]["x64"]["image"])')
        docker run --rm "$image" bash -ec '
          getconf GNU_LIBC_VERSION
          rpm -qa | sort
          command -v patchelf
          pkg-config --list-all | sort
          for name in freetype2 fontconfig x11 xcb xcb-renderutil xcb-icccm xkbcommon wayland-client wayland-server gl egl; do
            printf "DEPENDENCY %s: " "$name"
            pkg-config --modversion "$name" || true
          done
        ' 2>&1 | tee build-temp/logs/native-environment.log
    - name: Prepare missing Qt dependencies on the baseline
      run: |
        set -o pipefail
        image=$(python3 -c 'import json; print(json.load(open("scripts/linux-baseline/targets.json"))["targets"]["x64"]["image"])')
        docker run --rm -v "$PWD:/workspace" -w /workspace "$image" bash scripts/linux-baseline/prepare-native-deps.sh x64 \
          2>&1 | tee build-temp/logs/native-qt-dependencies.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-native-environment
        path: build-temp/logs/
  native:
    if: inputs.target == 'all' || inputs.target == 'native'
    name: glibc 2.17 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: ubuntu-22.04
        - arch: arm64
          runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache/restore@v4
      id: baseline-cache
      with:
        path: build-temp/baseline-${{ matrix.arch }}
        key: baseline-217-${{ matrix.arch }}-${{ hashFiles('scripts/linux-baseline/prepare-native.sh', 'scripts/linux-baseline/probe-mixed-cxx.sh', 'scripts/linux-baseline/targets.json') }}
        restore-keys: baseline-217-${{ matrix.arch }}-
    - name: Prepare and execute the native baseline probe
      env:
        TARGET: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        image=$(python3 -c 'import json,os; print(json.load(open("scripts/linux-baseline/targets.json"))["targets"][os.environ["TARGET"]]["image"])')
        docker pull "$image"
        pinned=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
        printf '%s\n' "$pinned" >"build-temp/logs/$TARGET-image.txt"
        docker run --rm -e GITHUB_TOKEN -v "$PWD:/workspace" -w /workspace "$pinned" \
          bash scripts/linux-baseline/prepare-native.sh "$TARGET" \
          2>&1 | tee "build-temp/logs/$TARGET-217-toolchain.log"
        docker run --rm -v "$PWD:/workspace" -w /workspace "$pinned" \
          bash -ec 'export PATH=/opt/python/cp311-cp311/bin:$PATH; bash scripts/linux-baseline/package-native.sh "$1"' _ "$TARGET" \
          2>&1 | tee "build-temp/logs/$TARGET-217-packaging.log"
    - uses: actions/cache/save@v4
      if: always() && steps.baseline-cache.outputs.cache-hit != 'true' && hashFiles(format('build-temp/baseline-{0}/gcc/.ready', matrix.arch)) != ''
      with:
        path: build-temp/baseline-${{ matrix.arch }}
        key: ${{ steps.baseline-cache.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      with:
        name: native-toolchain-${{ matrix.arch }}
        compression-level: 0
        path: Output/toolchains/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-baseline-217-${{ matrix.arch }}
        path: build-temp/logs/
  publish-native:
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: native-toolchain-*
        merge-multiple: true
        path: toolchains
    - name: Release the accepted native toolchains
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        cd toolchains
        cat *.sha256 > SHA256SUMS
        sha256sum -c SHA256SUMS
        cat > notes.md <<'EOF'
        x64 and ARM64 native Clang 20.1.8 + full GCC/libstdc++ 13.3.0 + glibc 2.17 sysroots. Both archives passed relocation, Clang and GCC C++20/thread execution, available matching older-GNU-library ABI interoperability, ELF glibc requirements and private runtime dependency checks in pinned manylinux2014 containers. Legacy distro headers may only support ABI=0; their unavailable ABI=1 is explicitly recorded instead of claimed as tested. Source pins, build scripts, GNU license files and sysroot package provenance are included.

        These are reusable toolchains. Qt SDK acceptance is separate and has not been implied by this toolchain release. Host architecture must match the selected archive.
        EOF
        gh release create "toolchain-native-217-$RUN_ID" --target "$COMMIT" --latest=false --title "Linux glibc 2.17 native toolchains ($RUN_ID)" --notes-file notes.md *.tar.xz SHA256SUMS
  mips:
    if: inputs.target == 'all' || inputs.target == 'cross' || inputs.target == 'mips'
    name: Build MIPS64EL glibc 2.17 sysroot
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache/restore@v4
      id: mips-cache
      with:
        path: build-temp/baseline-mips64el
        key: mips217-gnu-${{ hashFiles('scripts/linux-baseline/prepare-mips.sh') }}
    - uses: actions/cache/restore@v4
      id: mips-downloads
      with:
        path: build-temp/baseline-downloads
        key: baseline-gnu-downloads-${{ hashFiles('scripts/linux-baseline/prepare-mips.sh') }}
        restore-keys: baseline-gnu-downloads-
    - name: Build the pinned source toolchain
      if: steps.mips-cache.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        bash scripts/linux-baseline/prepare-mips.sh 2>&1 | tee build-temp/logs/mips217-toolchain.log
    - uses: actions/cache/save@v4
      if: always() && steps.mips-downloads.outputs.cache-hit != 'true'
      with:
        path: build-temp/baseline-downloads
        key: ${{ steps.mips-downloads.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: steps.mips-cache.outputs.cache-hit != 'true'
      with:
        path: build-temp/baseline-mips64el
        key: ${{ steps.mips-cache.outputs.cache-primary-key }}
    - uses: actions/cache/restore@v4
      id: mips-vendor
      with:
        path: build-temp/loong28-inspection/downloads
        key: mips-vendor-clang-${{ hashFiles('scripts/linux-baseline/load-vendor-clang.sh') }}
        restore-keys: loong28-vendor-inputs-
    - name: Execute Clang C++20 on MIPS glibc 2.17
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        bash scripts/linux-baseline/probe-mips.sh 2>&1 | tee build-temp/logs/mips217-probe.log
    - uses: actions/cache/save@v4
      if: always() && steps.mips-vendor.outputs.cache-hit != 'true'
      with:
        path: build-temp/loong28-inspection/downloads
        key: ${{ steps.mips-vendor.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-baseline-mips217
        path: build-temp/logs/
  loongarch:
    if: inputs.target == 'all' || inputs.target == 'cross' || inputs.target == 'loongarch'
    name: Inspect LoongArch glibc 2.28 ABI inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache/restore@v4
      id: loong-inputs
      with:
        path: build-temp/loong28-inspection/downloads
        key: loong28-vendor-inputs-${{ hashFiles('scripts/linux-baseline/inspect-loongarch.sh') }}
        restore-keys: loong28-vendor-inputs-
    - name: Record compiler ABI modes and libc symbol versions
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        bash scripts/linux-baseline/inspect-loongarch.sh 2>&1 | tee build-temp/logs/loong28-inspection.log
    - uses: actions/cache/save@v4
      if: always() && steps.loong-inputs.outputs.cache-hit != 'true'
      with:
        path: build-temp/loong28-inspection/downloads
        key: ${{ steps.loong-inputs.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-baseline-loong28
        path: build-temp/logs/
  loongarch-oldworld:
    if: inputs.target == 'all' || inputs.target == 'cross' || inputs.target == 'loongarch-oldworld'
    name: Clang C++20 on LoongArch old-world glibc 2.28
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Install host packaging tool
      run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends patchelf
    - uses: actions/cache/restore@v4
      id: oldworld-runtime
      with:
        path: build-temp/baseline-loong64-oldworld
        key: loong-oldworld-228-${{ hashFiles('scripts/linux-baseline/prepare-loongarch-oldworld.sh') }}
        restore-keys: loong-oldworld-228-
    - uses: actions/cache/restore@v4
      id: oldworld-inputs
      with:
        path: build-temp/loong28-inspection/downloads
        key: loong-oldworld-downloads-${{ hashFiles('scripts/linux-baseline/load-vendor-clang.sh') }}
        restore-keys: loong28-vendor-inputs-
    - name: Build and execute the old-world runtime
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        bash scripts/linux-baseline/prepare-loongarch-oldworld.sh 2>&1 | tee build-temp/logs/loong-oldworld-228.log
    - uses: actions/cache/save@v4
      if: always() && steps.oldworld-runtime.outputs.cache-hit != 'true' && hashFiles('build-temp/baseline-loong64-oldworld/runtime/.ready') != ''
      with:
        path: build-temp/baseline-loong64-oldworld
        key: ${{ steps.oldworld-runtime.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: always() && steps.oldworld-inputs.outputs.cache-hit != 'true'
      with:
        path: build-temp/loong28-inspection/downloads
        key: ${{ steps.oldworld-inputs.outputs.cache-primary-key }}
    - name: Relocate and package the accepted old-world toolchain
      run: |
        set -o pipefail
        bash scripts/linux-baseline/package-loongarch-oldworld.sh 2>&1 | tee build-temp/logs/loong-oldworld-packaging.log
    - uses: actions/upload-artifact@v4
      with:
        name: oldworld-toolchain
        compression-level: 0
        path: Output/toolchains/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-baseline-loong-oldworld-228
        path: build-temp/logs/
  publish-oldworld:
    needs: loongarch-oldworld
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: oldworld-toolchain
        path: toolchains
    - name: Release the accepted old-world toolchain
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        cd toolchains
        cat *.sha256 > SHA256SUMS
        sha256sum -c SHA256SUMS
        cat > notes.md <<'EOF'
        LoongArch old-world glibc 2.28 cross toolchain: Clang 20.1.8, a real vendor old-world sysroot with GNU GCC 8 support files, and Clang-built private libstdc++ 13.3.0 with GNU symbol versions. Passed C++20/thread/format execution and private-runtime resolution in a real target chroot, then repeated compilation, dependency checks and execution after relocation. Tested host: Ubuntu 22.04 x86_64; private libffi6 included.

        This toolchain is exclusively old-world ELF ABI 0x3 with /lib64/ld.so.1. It is not a new-world target and is not a Qt SDK acceptance result. Source pins, GNU and LLVM notices, and build scripts are included.
        EOF
        gh release create "toolchain-loong64-oldworld-228-$RUN_ID" --target "$COMMIT" --latest=false --title "LoongArch old-world glibc 2.28 toolchain ($RUN_ID)" --notes-file notes.md *.tar.xz SHA256SUMS
