name: Verify an extracted Linux baseline SDK
on:
  workflow_call:
    inputs:
      source_run:
        type: string
        required: true
      arch:
        type: string
        required: true
      variant:
        type: string
        required: true
      inspect_gnu_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source_run:
        description: Build accepted Linux baseline SDKs run containing the artifact
        type: string
        required: true
      arch:
        type: choice
        options: [x64, arm64, loong64-oldworld, loong64-newworld, mips64el]
        required: true
      variant:
        type: choice
        options: [release, debug]
        default: release
      inspect_gnu_only:
        description: Report the existing SDK GNU imports without rebuilding or declaring it accepted
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Bind verification to the SDK's successful job and original toolchain pins
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SOURCE_RUN: ${{ inputs.source_run }}
        ARCH: ${{ inputs.arch }}
        VARIANT: ${{ inputs.variant }}
      run: |
        python3 - <<'PY'
        import base64, json, os, subprocess
        from pathlib import Path
        repo, run_id, arch, variant = (os.environ[n] for n in ('GH_REPO', 'SOURCE_RUN', 'ARCH', 'VARIANT'))
        assert run_id.isdigit()
        def api(path):
            return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + path], text=True))
        run = api('/actions/runs/' + run_id)
        assert run['path'].split('@')[0] in (
            '.github/workflows/BuildLinuxBaselines.yml',
            '.github/workflows/LinuxPipeline.yml',
            '.github/workflows/BuildBinaries.yml'), run['path']
        name = ('Qt glibc 2.17' if arch in ('x64', 'arm64') else 'Qt cross baseline') + ' (' + arch + ', ' + variant + ')'
        jobs = api('/actions/runs/' + run_id + '/jobs?filter=all&per_page=100')['jobs']
        assert any((j['name'] == name or j['name'].endswith(' / ' + name))
                   and j['conclusion'] == 'success' for j in jobs), name
        content = api('/contents/scripts/linux-baseline/toolchains.lock.json?ref=' + run['head_sha'])
        raw = base64.b64decode(content['content'])
        entries = json.loads(raw)['targets']
        Path('build-temp').mkdir(exist_ok=True)
        Path('build-temp/source-toolchains.lock.json').write_bytes(raw)
        host = 'arm64' if arch == 'arm64' else 'x64'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write('commit=' + run['head_sha'] + '\n')
            out.write('host=' + host + '\nhost_sha=' + entries[host]['sha256'] + '\n')
            if arch not in ('x64', 'arm64'):
                out.write('cross_sha=' + entries[arch]['sha256'] + '\n')
        PY
    - name: Check ELF rejection gates
      run: bash scripts/test-package-linux.sh
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ inputs.source_run }}
        name: qt5.15.17_linux_${{ inputs.arch }}_${{ inputs.variant }}
        path: artifacts
    - uses: actions/cache/restore@v4
      id: host-toolchain
      with:
        path: build-temp/accepted-${{ steps.source.outputs.host }}
        key: accepted-native-${{ steps.source.outputs.host }}-${{ steps.source.outputs.host_sha }}
    - uses: actions/cache/restore@v4
      if: inputs.arch != 'x64' && inputs.arch != 'arm64'
      id: cross-toolchain
      with:
        path: build-temp/accepted-${{ inputs.arch }}
        key: accepted-cross-${{ inputs.arch }}-${{ steps.source.outputs.cross_sha }}
    - name: Restore the original accepted toolchains without rebuilding
      env:
        GITHUB_TOKEN: ${{ github.token }}
        QT_TOOLCHAIN_LOCK: ${{ github.workspace }}/build-temp/source-toolchains.lock.json
        ARCH: ${{ inputs.arch }}
        HOST: ${{ steps.source.outputs.host }}
      run: |
        bash scripts/linux-baseline/download-toolchain.sh "$HOST" "build-temp/accepted-$HOST"
        if [[ "$ARCH" != x64 && "$ARCH" != arm64 ]]; then
          bash scripts/linux-baseline/download-toolchain.sh "$ARCH" "build-temp/accepted-$ARCH"
        fi
    - name: Consume the archives in a fresh baseline environment
      env:
        ARCH: ${{ inputs.arch }}
        VARIANT: ${{ inputs.variant }}
        QT_VERIFY_SOURCE_RUN: ${{ inputs.source_run }}
        QT_VERIFY_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        QT_INSPECT_GNU_ONLY: ${{ inputs.inspect_gnu_only }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        if [[ "$ARCH" == x64 || "$ARCH" == arm64 ]]; then
          image=$(python3 -c 'import json,os; print(json.load(open("scripts/linux-baseline/targets.json"))["targets"][os.environ["ARCH"]]["image"])')
          docker run --rm -e QT_VERIFY_SOURCE_RUN -e QT_VERIFY_SOURCE_COMMIT -e GITHUB_SHA -e QT_INSPECT_GNU_ONLY \
            -v "$PWD:/workspace" -w /workspace "$image" \
            bash scripts/linux-baseline/build-native-sdk.sh "$ARCH" "$VARIANT" artifacts \
            2>&1 | tee build-temp/logs/extracted-sdk.log
        else
          sudo bash scripts/linux-baseline/prepare-cross-host.sh "$ARCH"
          sudo -E bash scripts/linux-baseline/build-cross-sdk.sh "$ARCH" "$VARIANT" artifacts \
            2>&1 | tee build-temp/logs/extracted-sdk.log
        fi
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: verification-${{ inputs.arch }}-${{ inputs.variant }}
        path: build-temp/logs/
  modern-consumers:
    needs: verify
    if: ${{ !inputs.inspect_gnu_only && (inputs.arch == 'x64' || inputs.arch == 'arm64') }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ inputs.source_run }}
        pattern: qt5.15.17_linux_${{ inputs.arch }}_${{ inputs.variant }}
        merge-multiple: true
        path: artifacts
    - name: Read the published native compiler cache identity
      id: modern-toolchain
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        python3 - <<'PY'
        import json, os
        entry = json.load(open('scripts/linux-baseline/toolchains.lock.json'))['targets'][os.environ['ARCH']]
        with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
            stream.write('sha256=' + entry['sha256'] + '\n')
        PY
    - uses: actions/cache/restore@v4
      with:
        path: build-temp/accepted-${{ inputs.arch }}
        key: accepted-native-${{ inputs.arch }}-${{ steps.modern-toolchain.outputs.sha256 }}
    - name: Restore published native Clang without rebuilding it
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: bash scripts/linux-baseline/download-toolchain.sh "${{ inputs.arch }}" "build-temp/accepted-${{ inputs.arch }}"
    - name: Consume the same SDK with modern GCC and Clang
      env:
        QT_VERIFY_SOURCE_RUN: ${{ inputs.source_run }}
        QT_VERIFY_SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        sudo python3 scripts/linux-baseline/prepare-modern-host.py "build-temp/accepted-${{ inputs.arch }}" \
          --report "build-temp/logs/modern-host-${{ inputs.arch }}-${{ inputs.variant }}.json"
        bash scripts/linux-baseline/verify-modern-consumers.sh "${{ inputs.arch }}" "${{ inputs.variant }}" artifacts \
          2>&1 | tee build-temp/logs/modern-consumers.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: modern-consumers-${{ inputs.arch }}-${{ inputs.variant }}
        path: build-temp/logs/
