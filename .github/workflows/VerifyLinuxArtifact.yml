name: Verify an extracted Linux SDK

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed Build Binaries run containing the SDK artifact
        type: string
        required: true
      arch:
        type: choice
        options: [x64, arm64, loong64, mips64el]
        default: x64
      variant:
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
    - uses: actions/checkout@v4
    - name: Check packaging and symbol rejection gates
      run: bash scripts/test-package-linux.sh
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: ${{ inputs.source_run }}
        name: ${{ (inputs.arch == 'loong64' || inputs.arch == 'mips64el') && format('qt5.15.17_linux_{0}_{1}', inputs.arch, inputs.variant) || format('qt5.15.17_linux_{0}{1}', inputs.arch, inputs.variant == 'debug' && '_debug' || '') }}
        path: artifacts
    - uses: actions/cache/restore@v4
      with:
        path: build-temp/toolchain
        key: bionic-qt-${{ inputs.arch == 'arm64' && 'arm64' || 'x64' }}-${{ hashFiles('scripts/setup-linux-toolchain.sh', 'scripts/linux-toolchain.lock.json') }}
        restore-keys: bionic-qt-${{ inputs.arch == 'arm64' && 'arm64' || 'x64' }}-
    - uses: actions/cache/restore@v4
      if: inputs.arch == 'loong64' || inputs.arch == 'mips64el'
      with:
        path: |
          build-temp/toolchain/sysroot-${{ inputs.arch }}
          build-temp/toolchain/downloads
        key: cross-deps-${{ inputs.arch }}-${{ hashFiles('scripts/prepare-linux-sysroot.py', 'scripts/build-linux-cross-dependencies.py', format('scripts/sysroots/{0}.lock.json', inputs.arch)) }}
    - uses: actions/cache/restore@v4
      if: inputs.arch == 'loong64' || inputs.arch == 'mips64el'
      with:
        path: build-temp/toolchain/cross-${{ inputs.arch }}
        key: cross-bionic-${{ inputs.arch }}-${{ hashFiles('scripts/setup-cross-linux-toolchain.sh', 'scripts/build-linux-cross-dependencies.py', format('scripts/sysroots/{0}.lock.json', inputs.arch)) }}
    - name: Audit and consume the package in a new Ubuntu 18.04 container
      env:
        TARGET: ${{ inputs.arch }}
        VARIANT: ${{ inputs.variant }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        qt_container=$(python3 -c 'import json; print(json.load(open("scripts/linux-toolchain.lock.json"))["container"]["image"])')
        docker run --rm -e GITHUB_TOKEN -v "$PWD:/workspace" -w /workspace "$qt_container" \
          bash scripts/verify-linux-artifact.sh "$TARGET" "$VARIANT" artifacts \
          2>&1 | tee build-temp/logs/extracted-sdk.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics-extracted-${{ inputs.arch }}-${{ inputs.variant }}
        path: build-temp/logs/
