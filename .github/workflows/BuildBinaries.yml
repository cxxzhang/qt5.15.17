name: Build Binaries

on:
  push:
    branches: [main]
    paths:
    - '.github/workflows/BuildBinaries.yml'
    - 'scripts/*linux*'
    - 'onekey-build-linux-*.sh'
  workflow_dispatch:
    inputs:
      scope:
        description: Platforms to build
        type: choice
        options: [linux, all, linux-x64, linux-x64-debug]
        default: linux
      publish:
        description: Publish the verified packages as a GitHub release
        type: boolean
        default: false
      reuse_native_run:
        description: Optional prior run with matching native compilation inputs
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  release-gates:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Check complete-platform publication rejection gates
      run: |
        python3 -B scripts/test-collect-release.py
        python3 -B scripts/test-native-symbols.py

  windows-x86:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Reuse a matching successful native SDK
      id: native-cache
      if: inputs.reuse_native_run != ''
      shell: pwsh
      working-directory: C:/workspaces/qt5.15.17
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/restore-native-sdk.py --run "${{ inputs.reuse_native_run }}" --job windows-x86 --artifact qt5.15.17_windows_x86.zip --kind windows --destination Output/x86
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5
      if: steps.native-cache.outputs.restored != 'true'
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x86.bat
    - name: Package Windows SDK
      shell: pwsh
      working-directory: C:/workspaces/qt5.15.17
      run: python scripts/windows-sdk.py --sdk Output/x86 --target x86 --variant release --output archives/qt5.15.17_windows_x86.zip --symbols archives/qt5.15.17_windows_x86-symbols.zip
    - name: Verify the installed Windows qmake
      shell: pwsh
      run: |
        $version = & "C:/workspaces/qt5.15.17/Output/x86/bin/qmake.exe" -query QT_VERSION
        if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "5.15.17") { throw "Invalid installed qmake" }
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x86.zip
        if-no-files-found: error
        compression-level: 0
        path: |
          C:\workspaces\qt5.15.17\archives\qt5.15.17_windows_x86.zip
          C:\workspaces\qt5.15.17\archives\qt5.15.17_windows_x86-symbols.zip

