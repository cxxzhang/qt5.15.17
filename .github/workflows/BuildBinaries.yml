  linux:
    uses: ./.github/workflows/LinuxPipeline.yml
    with:
      target: ${{ (github.event_name == 'push' || inputs.scope == 'linux-x64' || inputs.scope == 'linux-x64-debug') && 'x64' || 'all' }}
      variant: ${{ inputs.scope == 'linux-x64-debug' && 'debug' || (github.event_name == 'push' || inputs.scope == 'linux-x64') && 'release' || 'all' }}

  macos-x64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure git user
      run: |
        git config --global user.email "ci@github-actions.com"
        git config --global user.name "GitHub Actions"
    - name: Reuse a matching successful native SDK
      id: native-cache
      if: inputs.reuse_native_run != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/restore-native-sdk.py --run "${{ inputs.reuse_native_run }}" --job macos-x64 --artifact qt5.15.17_macos_x64 --kind macos --destination Output/macos-x64
    - name: Check real dSYM and stripped binary packaging
      run: bash scripts/test-macos-symbols.sh
    - name: Build qt5 macOS x64
      if: steps.native-cache.outputs.restored != 'true'
      run: bash ./onekey-build-macos-x64.sh
    - name: Audit and archive the x64 SDK with executable permissions
      run: |
        python3 scripts/macos-sdk.py relocate Output/macos-x64 x86_64
        python3 scripts/native-symbols.py macos Output/macos-x64 Output/qt5.15.17_macos_x64.tar.gz Output/qt5.15.17_macos_x64-symbols.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_x64
        path: |
          Output/qt5.15.17_macos_x64.tar.gz
          Output/qt5.15.17_macos_x64-symbols.tar.gz
        if-no-files-found: error

  macos-arm64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure git user
      run: |
        git config --global user.email "ci@github-actions.com"
        git config --global user.name "GitHub Actions"
    - name: Reuse a matching successful native SDK
      id: native-cache
      if: inputs.reuse_native_run != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/restore-native-sdk.py --run "${{ inputs.reuse_native_run }}" --job macos-arm64 --artifact qt5.15.17_macos_arm64 --kind macos --destination Output/macos-arm64
    - name: Check real dSYM and stripped binary packaging
      run: bash scripts/test-macos-symbols.sh
    - name: Build qt5 macOS arm64
      if: steps.native-cache.outputs.restored != 'true'
      run: bash ./onekey-build-macos-arm64.sh
    - name: Audit and archive the ARM64 SDK with executable permissions
      run: |
        python3 scripts/macos-sdk.py relocate Output/macos-arm64 arm64
        python3 scripts/native-symbols.py macos Output/macos-arm64 Output/qt5.15.17_macos_arm64.tar.gz Output/qt5.15.17_macos_arm64-symbols.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_arm64
        path: |
          Output/qt5.15.17_macos_arm64.tar.gz
          Output/qt5.15.17_macos_arm64-symbols.tar.gz
        if-no-files-found: error


  macos-universal:
    needs:
    - macos-x64
    - macos-arm64
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Download macOS x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_x64
        path: ./archives
    - name: Download macOS arm64 artifact
      uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_arm64
        path: ./archives
    - name: Create universal binaries
      run: |
        mkdir -p macos-x64 macos-arm64
        tar -xzf archives/qt5.15.17_macos_x64.tar.gz -C macos-x64
        tar -xzf archives/qt5.15.17_macos_arm64.tar.gz -C macos-arm64
        python3 scripts/native-symbols.py restore-macos macos-x64 archives/qt5.15.17_macos_x64-symbols.tar.gz
        python3 scripts/native-symbols.py restore-macos macos-arm64 archives/qt5.15.17_macos_arm64-symbols.tar.gz
        python3 scripts/macos-sdk.py merge macos-x64 macos-arm64 macos-universal
        python3 scripts/native-symbols.py macos macos-universal qt5.15.17_macos_universal.tar.gz qt5.15.17_macos_universal-symbols.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_universal
        path: |
          qt5.15.17_macos_universal.tar.gz
          qt5.15.17_macos_universal-symbols.tar.gz
        if-no-files-found: error

  verify-macos:
    needs: [macos-x64, macos-arm64, macos-universal]
    strategy:
      fail-fast: false
      matrix:
        include:
        - {target: x64, consumer: x86_64, architectures: x86_64, runner: macos-15-intel}
        - {target: arm64, consumer: arm64, architectures: arm64, runner: macos-15}
        - {target: universal, consumer: x86_64, architectures: 'x86_64 arm64', runner: macos-15-intel}
        - {target: universal, consumer: arm64, architectures: 'x86_64 arm64', runner: macos-15}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_${{ matrix.target }}
        path: archives
    - name: Consume the extracted SDK on its native architecture
      run: bash scripts/verify-macos-sdk.sh "archives/qt5.15.17_macos_${{ matrix.target }}.tar.gz" "${{ matrix.target }}" "${{ matrix.consumer }}" ${{ matrix.architectures }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: verification-macos-${{ matrix.target }}-${{ matrix.consumer }}
        path: build-temp/logs/

  verify-windows:
    needs: [windows-x86, windows-x64, windows-arm64, windows-x86-debug, windows-x64-debug, windows-arm64-debug]
    if: inputs.scope == 'all'
    strategy:
      fail-fast: false
      matrix:
        target: [x86, x64, arm64]
        variant: [release, debug]
    uses: ./.github/workflows/VerifyWindowsArtifact.yml
    with:
      source_run: ${{ github.run_id }}
      target: ${{ matrix.target }}
      variant: ${{ matrix.variant }}

  release:
    needs: [release-gates, linux, windows-x86, windows-x64, windows-arm64, windows-x86-debug, windows-x64-debug, windows-arm64-debug, macos-x64, macos-arm64, macos-universal, verify-macos, verify-windows]
    if: >-
      ${{ !cancelled() && inputs.publish && needs.linux.result == 'success' && needs.release-gates.result == 'success' &&
      (inputs.scope == 'linux' || inputs.scope == 'all' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: qt5.15.17_*
        path: release_work
    - uses: actions/download-artifact@v4
      with:
        pattern: verification-*
        path: release_work/verification
    - uses: actions/download-artifact@v4
      with:
        pattern: modern-consumers-*
        path: release_work/modern
    - uses: actions/download-artifact@v4
      with:
        name: linux-acceptance-manifest
        path: release_work/linux-acceptance-manifest
    - name: Collect release packages
      run: |
        mkdir release_zips
        for artifact in release_work/qt5.15.17_linux_*; do
          cp "$artifact"/*.tar.gz release_zips/
        done
        python3 scripts/linux-baseline/collect-acceptance.py --sdk release_zips \
          --verification release_work/verification --modern release_work/modern \
          --targets-spec scripts/linux-baseline/targets.json --toolchains scripts/linux-baseline/toolchains.lock.json \
          --target all --variant all --source-run "${{ github.run_id }}" --source-commit "${{ github.sha }}" \
          --output release_zips/linux-acceptance-manifest.json
        cmp release_work/linux-acceptance-manifest/linux-acceptance-manifest.json release_zips/linux-acceptance-manifest.json
        for artifact in release_work/*; do
          name="${artifact##*/}"
          case "$name" in
            diagnostics-*|verification-*|modern-consumers-*|verification|modern|linux-acceptance-manifest|qt5.15.17_linux_*) continue ;;
            qt5.15.17_windows_*.zip) cp "$artifact"/*.zip release_zips/ ;;
            qt5.15.17_macos_*) cp "$artifact"/*.tar.gz release_zips/ ;;
            *) echo "Unexpected artifact: $name" >&2; exit 1 ;;
          esac
        done
        python3 scripts/collect-release.py --packages release_zips --proofs release_work \
          --scope "${{ inputs.scope }}" --run "${{ github.run_id }}" --commit "${{ github.sha }}"
    - name: Publish verified packages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "qt5.15.17-${{ github.run_id }}" release_zips/*           --target "${{ github.sha }}" --title "Qt 5.15.17 build ${{ github.run_id }}"
