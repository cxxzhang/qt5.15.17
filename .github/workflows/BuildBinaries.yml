name: Build Binaries

on:
  push:
    branches: [main]
    paths:
    - '.github/workflows/BuildBinaries.yml'
    - 'scripts/*linux*'
    - 'onekey-build-linux-*.sh'
  workflow_dispatch:
    inputs:
      scope:
        description: Platforms to build
        type: choice
        options: [linux, all, linux-x64, linux-x64-debug]
        default: linux
      publish:
        description: Publish the verified packages as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  windows-x86:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x86.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x86.zip
        path: C:\workspaces\qt5.15.17\Output\x86

  windows-x64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x64.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x64.zip
        path: C:\workspaces\qt5.15.17\Output\x64

  windows-arm64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-11-arm
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 arm64
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-arm64.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_arm64.zip
        path: C:\workspaces\qt5.15.17\Output\arm64

  windows-x86-debug:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 debug x86
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x86-debug.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x86_debug.zip
        path: C:\workspaces\qt5.15.17\Output\x86d

  windows-x64-debug:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 debug x64
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x64-debug.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x64_debug.zip
        path: C:\workspaces\qt5.15.17\Output\x64d

  windows-arm64-debug:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-11-arm
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 debug arm64
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-arm64-debug.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_arm64_debug.zip
        path: C:\workspaces\qt5.15.17\Output\arm64d

  linux:
    uses: ./.github/workflows/LinuxPipeline.yml
    with:
      target: ${{ (github.event_name == 'push' || inputs.scope == 'linux-x64' || inputs.scope == 'linux-x64-debug') && 'x64' || 'all' }}
      variant: ${{ inputs.scope == 'linux-x64-debug' && 'debug' || (github.event_name == 'push' || inputs.scope == 'linux-x64') && 'release' || 'all' }}

  macos-x64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure git user
      run: |
        git config --global user.email "ci@github-actions.com"
        git config --global user.name "GitHub Actions"
    - name: Build qt5 macOS x64
      run: bash ./onekey-build-macos-x64.sh
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_x64
        path: ${{ github.workspace }}/Output/macos-x64

  macos-arm64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure git user
      run: |
        git config --global user.email "ci@github-actions.com"
        git config --global user.name "GitHub Actions"
    - name: Build qt5 macOS arm64
      run: bash ./onekey-build-macos-arm64.sh
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_arm64
        path: ${{ github.workspace }}/Output/macos-arm64


  macos-universal:
    needs:
    - macos-x64
    - macos-arm64
    runs-on: macos-14
    steps:
    - name: Download macOS x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_x64
        path: ./macos-x64
    - name: Download macOS arm64 artifact
      uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_arm64
        path: ./macos-arm64
    - name: Create universal binaries
      run: |
        mkdir -p macos-universal

        # Copy arm64 as base (preserves directory structure)
        cp -R macos-arm64/* macos-universal/

        # Find and merge all Mach-O binaries using lipo
        find macos-arm64 -type f | while read arm64_file; do
          rel_path="${arm64_file#macos-arm64/}"
          x64_file="macos-x64/$rel_path"
          universal_file="macos-universal/$rel_path"

          # Check if x64 counterpart exists
          if [ -f "$x64_file" ]; then
            # Check if it's a Mach-O binary
            if file "$arm64_file" | grep -q "Mach-O"; then
              echo "Creating universal binary: $rel_path"
              lipo -create "$x64_file" "$arm64_file" -output "$universal_file"
            fi
          fi
        done

        echo "Universal binary creation completed"
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_universal
        path: ./macos-universal

  release:
    needs: [linux, windows-x86, windows-x64, windows-arm64, windows-x86-debug, windows-x64-debug, windows-arm64-debug, macos-x64, macos-arm64, macos-universal]
    if: >-
      ${{ !cancelled() && inputs.publish && needs.linux.result == 'success' &&
      (inputs.scope == 'linux' || inputs.scope == 'all' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: release_work
    - name: Collect release packages
      run: |
        mkdir release_zips
        for artifact in release_work/qt5.15.17_linux_*; do
          cp "$artifact"/*.tar.gz release_zips/
        done
        python3 scripts/linux-baseline/collect-acceptance.py --sdk release_zips \
          --verification release_work --modern release_work \
          --targets-spec scripts/linux-baseline/targets.json --toolchains scripts/linux-baseline/toolchains.lock.json \
          --target all --variant all --source-run "${{ github.run_id }}" --source-commit "${{ github.sha }}" \
          --output release_zips/linux-acceptance-manifest.json
        cmp release_work/linux-acceptance-manifest/linux-acceptance-manifest.json release_zips/linux-acceptance-manifest.json
        for artifact in release_work/*; do
          name="${artifact##*/}"
          case "$name" in
            diagnostics-*|verification-*|modern-consumers-*|linux-acceptance-manifest|qt5.15.17_linux_*) continue ;;
            qt5.15.17_windows_*.zip) (cd "$artifact" && zip -qr "../../release_zips/$name" .) ;;
            qt5.15.17_macos_*) tar -C "$artifact" -czf "release_zips/$name.tar.gz" . ;;
            *) echo "Unexpected artifact: $name" >&2; exit 1 ;;
          esac
        done
    - name: Publish verified packages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "qt5.15.17-${{ github.run_id }}" release_zips/*           --target "${{ github.sha }}" --title "Qt 5.15.17 build ${{ github.run_id }}"
