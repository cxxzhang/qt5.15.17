name: Build Binaries

on:
  push:
    branches: [main]
    paths:
    - '.github/workflows/BuildBinaries.yml'
    - 'scripts/*linux*'
    - 'onekey-build-linux-*.sh'
  workflow_dispatch:
    inputs:
      scope:
        description: Platforms to build
        type: choice
        options: [linux, all, linux-x64, linux-x64-debug]
        default: linux
      publish:
        description: Publish the verified packages as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  release-gates:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Check complete-platform publication rejection gates
      run: python3 -B scripts/test-collect-release.py

  windows-x86:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x86.bat
    - name: Verify the installed Windows qmake
      shell: pwsh
      run: |
        $version = & "C:/workspaces/qt5.15.17/Output/x86/bin/qmake.exe" -query QT_VERSION
        if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "5.15.17") { throw "Invalid installed qmake" }
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x86.zip
        if-no-files-found: error
        path: C:\workspaces\qt5.15.17\Output\x86

  windows-x64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x64.bat
    - name: Verify the installed Windows qmake
      shell: pwsh
      run: |
        $version = & "C:/workspaces/qt5.15.17/Output/x64/bin/qmake.exe" -query QT_VERSION
        if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "5.15.17") { throw "Invalid installed qmake" }
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x64.zip
        if-no-files-found: error
        path: C:\workspaces\qt5.15.17\Output\x64

  windows-arm64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-11-arm
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 arm64
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-arm64.bat
    - name: Verify the installed Windows qmake
      shell: pwsh
      run: |
        $version = & "C:/workspaces/qt5.15.17/Output/arm64/bin/qmake.exe" -query QT_VERSION
        if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "5.15.17") { throw "Invalid installed qmake" }
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_arm64.zip
        if-no-files-found: error
        path: C:\workspaces\qt5.15.17\Output\arm64

  windows-x86-debug:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 debug x86
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x86-debug.bat
    - name: Verify the installed Windows qmake
      shell: pwsh
      run: |
        $version = & "C:/workspaces/qt5.15.17/Output/x86d/bin/qmake.exe" -query QT_VERSION
        if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "5.15.17") { throw "Invalid installed qmake" }
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x86_debug.zip
        if-no-files-found: error
        path: C:\workspaces\qt5.15.17\Output\x86d

  windows-x64-debug:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 debug x64
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x64-debug.bat
    - name: Verify the installed Windows qmake
      shell: pwsh
      run: |
        $version = & "C:/workspaces/qt5.15.17/Output/x64d/bin/qmake.exe" -query QT_VERSION
        if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "5.15.17") { throw "Invalid installed qmake" }
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x64_debug.zip
        if-no-files-found: error
        path: C:\workspaces\qt5.15.17\Output\x64d

  windows-arm64-debug:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-11-arm
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          if not exist C:\workspaces mkdir C:\workspaces
          mkdir C:\workspaces\qt5.15.17 || exit /b 1
          cd /d C:\workspaces\qt5.15.17
          git init || exit /b 1
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17 || exit /b 1
          git fetch --depth 1 --no-tags origin ${{ github.sha }} || exit /b 1
          git checkout --detach FETCH_HEAD || exit /b 1
          git submodule update --init --recursive --depth 1 || exit /b 1
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 debug arm64
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-arm64-debug.bat
    - name: Verify the installed Windows qmake
      shell: pwsh
      run: |
        $version = & "C:/workspaces/qt5.15.17/Output/arm64d/bin/qmake.exe" -query QT_VERSION
        if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "5.15.17") { throw "Invalid installed qmake" }
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_arm64_debug.zip
        if-no-files-found: error
        path: C:\workspaces\qt5.15.17\Output\arm64d

  linux:
    uses: ./.github/workflows/LinuxPipeline.yml
    with:
      target: ${{ (github.event_name == 'push' || inputs.scope == 'linux-x64' || inputs.scope == 'linux-x64-debug') && 'x64' || 'all' }}
      variant: ${{ inputs.scope == 'linux-x64-debug' && 'debug' || (github.event_name == 'push' || inputs.scope == 'linux-x64') && 'release' || 'all' }}

  macos-x64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure git user
      run: |
        git config --global user.email "ci@github-actions.com"
        git config --global user.name "GitHub Actions"
    - name: Build qt5 macOS x64
      run: bash ./onekey-build-macos-x64.sh
    - name: Audit and archive the x64 SDK with executable permissions
      run: |
        python3 scripts/macos-sdk.py audit Output/macos-x64 x86_64
        tar -C Output/macos-x64 -czf Output/qt5.15.17_macos_x64.tar.gz .
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_x64
        path: Output/qt5.15.17_macos_x64.tar.gz
        if-no-files-found: error

  macos-arm64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure git user
      run: |
        git config --global user.email "ci@github-actions.com"
        git config --global user.name "GitHub Actions"
    - name: Build qt5 macOS arm64
      run: bash ./onekey-build-macos-arm64.sh
    - name: Audit and archive the ARM64 SDK with executable permissions
      run: |
        python3 scripts/macos-sdk.py audit Output/macos-arm64 arm64
        tar -C Output/macos-arm64 -czf Output/qt5.15.17_macos_arm64.tar.gz .
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_arm64
        path: Output/qt5.15.17_macos_arm64.tar.gz
        if-no-files-found: error


  macos-universal:
    needs:
    - macos-x64
    - macos-arm64
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: Download macOS x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_x64
        path: ./archives
    - name: Download macOS arm64 artifact
      uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_arm64
        path: ./archives
    - name: Create universal binaries
      run: |
        mkdir -p macos-x64 macos-arm64
        tar -xzf archives/qt5.15.17_macos_x64.tar.gz -C macos-x64
        tar -xzf archives/qt5.15.17_macos_arm64.tar.gz -C macos-arm64
        python3 scripts/macos-sdk.py merge macos-x64 macos-arm64 macos-universal
        tar -C macos-universal -czf qt5.15.17_macos_universal.tar.gz .
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_universal
        path: qt5.15.17_macos_universal.tar.gz
        if-no-files-found: error

  verify-macos:
    needs: [macos-x64, macos-arm64, macos-universal]
    strategy:
      fail-fast: false
      matrix:
        include:
        - {target: x64, consumer: x86_64, architectures: x86_64, runner: macos-15-intel}
        - {target: arm64, consumer: arm64, architectures: arm64, runner: macos-14}
        - {target: universal, consumer: x86_64, architectures: 'x86_64 arm64', runner: macos-15-intel}
        - {target: universal, consumer: arm64, architectures: 'x86_64 arm64', runner: macos-14}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_${{ matrix.target }}
        path: archives
    - name: Consume the extracted SDK on its native architecture
      run: bash scripts/verify-macos-sdk.sh "archives/qt5.15.17_macos_${{ matrix.target }}.tar.gz" "${{ matrix.target }}" "${{ matrix.consumer }}" ${{ matrix.architectures }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: verification-macos-${{ matrix.target }}-${{ matrix.consumer }}
        path: build-temp/logs/

  release:
    needs: [release-gates, linux, windows-x86, windows-x64, windows-arm64, windows-x86-debug, windows-x64-debug, windows-arm64-debug, macos-x64, macos-arm64, macos-universal, verify-macos]
    if: >-
      ${{ !cancelled() && inputs.publish && needs.linux.result == 'success' && needs.release-gates.result == 'success' &&
      (inputs.scope == 'linux' || inputs.scope == 'all' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: release_work
    - name: Collect release packages
      run: |
        mkdir release_zips
        for artifact in release_work/qt5.15.17_linux_*; do
          cp "$artifact"/*.tar.gz release_zips/
        done
        python3 scripts/linux-baseline/collect-acceptance.py --sdk release_zips \
          --verification release_work --modern release_work \
          --targets-spec scripts/linux-baseline/targets.json --toolchains scripts/linux-baseline/toolchains.lock.json \
          --target all --variant all --source-run "${{ github.run_id }}" --source-commit "${{ github.sha }}" \
          --output release_zips/linux-acceptance-manifest.json
        cmp release_work/linux-acceptance-manifest/linux-acceptance-manifest.json release_zips/linux-acceptance-manifest.json
        for artifact in release_work/*; do
          name="${artifact##*/}"
          case "$name" in
            diagnostics-*|verification-*|modern-consumers-*|linux-acceptance-manifest|qt5.15.17_linux_*) continue ;;
            qt5.15.17_windows_*.zip) (cd "$artifact" && zip -qr "../../release_zips/$name" .) ;;
            qt5.15.17_macos_*) cp "$artifact/$name.tar.gz" release_zips/ ;;
            *) echo "Unexpected artifact: $name" >&2; exit 1 ;;
          esac
        done
        python3 scripts/collect-release.py --packages release_zips --proofs release_work \
          --scope "${{ inputs.scope }}" --run "${{ github.run_id }}" --commit "${{ github.sha }}"
    - name: Publish verified packages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "qt5.15.17-${{ github.run_id }}" release_zips/*           --target "${{ github.sha }}" --title "Qt 5.15.17 build ${{ github.run_id }}"
