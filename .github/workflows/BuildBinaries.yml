name: Build Binaries

on:
  push:
    branches: [main]
    paths:
    - '.github/workflows/BuildBinaries.yml'
    - 'scripts/*linux*'
    - 'onekey-build-linux-*.sh'
  workflow_dispatch:
    inputs:
      scope:
        description: Platforms to build
        type: choice
        options: [linux, all, linux-x64]
        default: linux
      publish:
        description: Publish the verified packages as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-x86:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          mkdir C:\workspaces
          cd /d C:\workspaces
          git clone --recurse-submodules --depth 1 --shallow-submodules --branch main --single-branch --no-tags --progress --verbose https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x86.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x86.zip
        path: C:\workspaces\qt5.15.17\Output\x86

  windows-x64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          mkdir C:\workspaces
          cd /d C:\workspaces
          git clone --recurse-submodules --depth 1 --shallow-submodules --branch main --single-branch --no-tags --progress --verbose https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x64.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x64.zip
        path: C:\workspaces\qt5.15.17\Output\x64

  windows-arm64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-11-arm
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          mkdir C:\workspaces
          cd /d C:\workspaces
          git clone --recurse-submodules --depth 1 --shallow-submodules --branch main --single-branch --no-tags --progress --verbose https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 arm64
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-arm64.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_arm64.zip
        path: C:\workspaces\qt5.15.17\Output\arm64

  windows-x86-debug:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          mkdir C:\workspaces
          cd /d C:\workspaces
          git clone --recurse-submodules --depth 1 --shallow-submodules --branch main --single-branch --no-tags --progress --verbose https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 debug x86
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x86-debug.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x86_debug.zip
        path: C:\workspaces\qt5.15.17\Output\x86d

  windows-x64-debug:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          mkdir C:\workspaces
          cd /d C:\workspaces
          git clone --recurse-submodules --depth 1 --shallow-submodules --branch main --single-branch --no-tags --progress --verbose https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 debug x64
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x64-debug.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_x64_debug.zip
        path: C:\workspaces\qt5.15.17\Output\x64d

  windows-arm64-debug:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: windows-11-arm
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - name: Clone repository
      shell: cmd
      run: |
          mkdir C:\workspaces
          cd /d C:\workspaces
          git clone --recurse-submodules --depth 1 --shallow-submodules --branch main --single-branch --no-tags --progress --verbose https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cxxzhang/qt5.15.17
    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Build qt5 debug arm64
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-arm64-debug.bat
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_windows_arm64_debug.zip
        path: C:\workspaces\qt5.15.17\Output\arm64d

  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || inputs.scope == 'linux-x64') && '[{"arch":"x64","variant":"release","runner":"ubuntu-22.04","asset":"linux_x64"}]' || '[{"arch":"x64","variant":"release","runner":"ubuntu-22.04","asset":"linux_x64"},{"arch":"x64","variant":"debug","runner":"ubuntu-22.04","asset":"linux_x64_debug"},{"arch":"arm64","variant":"release","runner":"ubuntu-22.04-arm","asset":"linux_arm64"},{"arch":"arm64","variant":"debug","runner":"ubuntu-22.04-arm","asset":"linux_arm64_debug"}]') }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Test ELF publishing gate
      run: bash scripts/test-package-linux.sh
    - uses: actions/cache/restore@v4
      id: toolchain-cache
      with:
        path: build-temp/toolchain
        key: bionic-qt-${{ matrix.arch }}-${{ hashFiles('scripts/setup-linux-toolchain.sh') }}
        restore-keys: bionic-qt-${{ matrix.arch }}-
    - name: Prepare Ubuntu 18.04 toolchain
      env:
        TARGET: ${{ matrix.arch }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        docker run -d --name qt-linux-build -v "$PWD:/workspace" -w /workspace \
          ubuntu:18.04 sleep infinity
        docker exec qt-linux-build bash scripts/setup-linux-toolchain.sh "$TARGET" \
          2>&1 | tee "build-temp/logs/$TARGET-toolchain.log"
    - uses: actions/cache/save@v4
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      with:
        path: build-temp/toolchain
        key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
    - name: Build and verify Ubuntu 18.04 SDK
      env:
        TARGET: ${{ matrix.arch }}
        VARIANT: ${{ matrix.variant }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        docker exec qt-linux-build \
          bash -ec 'PATH=/workspace/build-temp/toolchain/bin:$PATH bash scripts/build-linux.sh "$1" "$2"' \
          bash "$TARGET" "$VARIANT" 2>&1 | tee "build-temp/logs/$TARGET-$VARIANT.log"
    - name: Upload build diagnostics
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: diagnostics-${{ matrix.asset }}
        if-no-files-found: ignore
        path: build-temp/logs/
    - name: Remove build container
      if: always()
      run: docker rm -f qt-linux-build || true
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_${{ matrix.asset }}
        if-no-files-found: error
        path: |
          Output/qt5.15.17_${{ matrix.asset }}.tar.gz
          Output/qt5.15.17_${{ matrix.asset }}-symbols.tar.gz

  macos-x64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure git user
      run: |
        git config --global user.email "ci@github-actions.com"
        git config --global user.name "GitHub Actions"
    - name: Build qt5 macOS x64
      run: bash ./onekey-build-macos-x64.sh
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_x64
        path: ${{ github.workspace }}/Output/macos-x64

  macos-arm64:
    needs: linux
    if: inputs.scope == 'all'
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Configure git user
      run: |
        git config --global user.email "ci@github-actions.com"
        git config --global user.name "GitHub Actions"
    - name: Build qt5 macOS arm64
      run: bash ./onekey-build-macos-arm64.sh
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_arm64
        path: ${{ github.workspace }}/Output/macos-arm64


  macos-universal:
    needs:
    - macos-x64
    - macos-arm64
    runs-on: macos-14
    steps:
    - name: Download macOS x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_x64
        path: ./macos-x64
    - name: Download macOS arm64 artifact
      uses: actions/download-artifact@v4
      with:
        name: qt5.15.17_macos_arm64
        path: ./macos-arm64
    - name: Create universal binaries
      run: |
        mkdir -p macos-universal

        # Copy arm64 as base (preserves directory structure)
        cp -R macos-arm64/* macos-universal/

        # Find and merge all Mach-O binaries using lipo
        find macos-arm64 -type f | while read arm64_file; do
          rel_path="${arm64_file#macos-arm64/}"
          x64_file="macos-x64/$rel_path"
          universal_file="macos-universal/$rel_path"

          # Check if x64 counterpart exists
          if [ -f "$x64_file" ]; then
            # Check if it's a Mach-O binary
            if file "$arm64_file" | grep -q "Mach-O"; then
              echo "Creating universal binary: $rel_path"
              lipo -create "$x64_file" "$arm64_file" -output "$universal_file"
            fi
          fi
        done

        echo "Universal binary creation completed"
    - uses: actions/upload-artifact@v4
      with:
        name: qt5.15.17_macos_universal
        path: ./macos-universal

  release:
    needs: [linux, windows-x86, windows-x64, windows-arm64, windows-x86-debug, windows-x64-debug, windows-arm64-debug, macos-x64, macos-arm64, macos-universal]
    if: >-
      ${{ !cancelled() && inputs.publish && needs.linux.result == 'success' &&
      (inputs.scope == 'linux' || inputs.scope == 'all' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: release_work
    - name: Collect release packages
      run: |
        mkdir release_zips
        for artifact in release_work/*; do
          name="${artifact##*/}"
          case "$name" in
            diagnostics-*) continue ;;
            qt5.15.17_linux_*) cp "$artifact"/*.tar.gz release_zips/ ;;
            qt5.15.17_windows_*.zip) (cd "$artifact" && zip -qr "../../release_zips/$name" .) ;;
            qt5.15.17_macos_*) tar -C "$artifact" -czf "release_zips/$name.tar.gz" . ;;
            *) echo "Unexpected artifact: $name" >&2; exit 1 ;;
          esac
        done
    - name: Publish verified packages
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "qt5.15.17-${{ github.run_id }}" release_zips/*           --target "${{ github.sha }}" --title "Qt 5.15.17 build ${{ github.run_id }}"
