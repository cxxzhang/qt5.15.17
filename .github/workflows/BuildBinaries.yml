    - name: Set up VC-LTL
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: call C:\workspaces\qt5.15.17\.github\workflows\setup-vc-ltl.bat
    - name: Watch SDK code generators
      if: steps.native-cache.outputs.restored != 'true'
      shell: pwsh
      run: |
        $sdkRoot = 'C:/workspaces/qt5.15.17'
        $logs = Join-Path $sdkRoot 'build-temp/logs'
        New-Item -ItemType Directory -Force -Path $logs | Out-Null
        $watcher = Start-Process -FilePath (Get-Process -Id $PID).Path -WindowStyle Hidden -PassThru -ArgumentList @('-NoProfile','-File',"$sdkRoot/scripts/watch-windows-build.ps1",'-SdkRoot',$sdkRoot) -RedirectStandardOutput "$logs/watcher-output.txt" -RedirectStandardError "$logs/watcher-errors.txt"
        $watcher.Id | Set-Content (Join-Path $logs 'watcher.pid')
    - name: Build qt5 debug x86
      if: steps.native-cache.outputs.restored != 'true'
      shell: cmd
      working-directory: C:\workspaces\qt5.15.17
      run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions"
          call C:\workspaces\qt5.15.17\apply-patches.bat
          call C:\workspaces\qt5.15.17\onekey-build-windows-x86-debug.bat
    - name: Stop SDK generator diagnostics
      if: always()
      shell: pwsh
      run: |
        $marker = 'C:/workspaces/qt5.15.17/build-temp/logs/watcher.pid'
        if (Test-Path -LiteralPath $marker) {
          $watcherId = [int](Get-Content -LiteralPath $marker)
          $owned = Get-CimInstance Win32_Process -Filter "ProcessId=$watcherId" -ErrorAction SilentlyContinue
          if ($owned -and $owned.CommandLine -like '*watch-windows-build.ps1*') { Stop-Process -Id $watcherId -Force -ErrorAction SilentlyContinue }
        }
    - uses: actions/upload-artifact@v4
