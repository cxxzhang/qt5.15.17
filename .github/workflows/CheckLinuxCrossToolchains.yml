name: Check Linux cross toolchains

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [loong64, mips64el]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache/restore@v4
      with:
        path: build-temp/toolchain
        key: bionic-qt-x64-${{ hashFiles('scripts/setup-linux-toolchain.sh') }}
    - uses: actions/cache/restore@v4
      id: cross-deps
      with:
        path: |
          build-temp/toolchain/sysroot-${{ matrix.arch }}
          build-temp/toolchain/downloads
        key: cross-deps-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-linux-sysroot.py', format('scripts/sysroots/{0}.lock.json', matrix.arch)) }}
    - uses: actions/cache/restore@v4
      id: cross-cache
      with:
        path: build-temp/toolchain/cross-${{ matrix.arch }}
        key: cross-bionic-${{ matrix.arch }}-${{ hashFiles('scripts/setup-cross-linux-toolchain.sh', format('scripts/sysroots/{0}.lock.json', matrix.arch)) }}
    - name: Build and execute target C++20 probe
      env:
        TARGET: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        docker run --rm -e GITHUB_TOKEN -v "$PWD:/workspace" -w /workspace ubuntu:18.04 \
          bash -ec 'bash scripts/setup-linux-toolchain.sh x64; bash scripts/setup-cross-linux-toolchain.sh "$1"' \
          bash "$TARGET" 2>&1 | tee "build-temp/logs/cross-$TARGET.log"
    - uses: actions/cache/save@v4
      if: always() && steps.cross-deps.outputs.cache-hit != 'true'
      with:
        path: |
          build-temp/toolchain/sysroot-${{ matrix.arch }}
          build-temp/toolchain/downloads
        key: ${{ steps.cross-deps.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: steps.cross-cache.outputs.cache-hit != 'true'
      with:
        path: build-temp/toolchain/cross-${{ matrix.arch }}
        key: ${{ steps.cross-cache.outputs.cache-primary-key }}
    - name: Upload cross toolchain diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cross-toolchain-${{ matrix.arch }}
        if-no-files-found: ignore
        path: build-temp/logs/
