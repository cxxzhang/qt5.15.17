name: Check Linux cross toolchains

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: all
      build_sdk:
        type: boolean
        default: true
      variant:
        type: string
        default: release
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [all, loong64, mips64el]
        default: all
      build_sdk:
        description: Build and verify the complete Qt SDK after the toolchain probe
        type: boolean
        default: false
      variant:
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

jobs:
  toolchain:
    name: ${{ inputs.build_sdk && 'Qt SDK' || 'Toolchain' }} (${{ matrix.arch }}, ${{ inputs.variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.target == 'loong64' && '["loong64"]' || inputs.target == 'mips64el' && '["mips64el"]' || '["loong64","mips64el"]') }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: ${{ inputs.build_sdk && 'recursive' || false }}
    - uses: actions/cache/restore@v4
      with:
        path: build-temp/toolchain
        key: bionic-qt-x64-${{ hashFiles('scripts/setup-linux-toolchain.sh') }}
        restore-keys: bionic-qt-x64-
    - uses: actions/cache/restore@v4
      id: cross-deps
      with:
        path: |
          build-temp/toolchain/sysroot-${{ matrix.arch }}
          build-temp/toolchain/downloads
        key: cross-deps-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-linux-sysroot.py', 'scripts/build-linux-cross-dependencies.py', format('scripts/sysroots/{0}.lock.json', matrix.arch)) }}
    - uses: actions/cache/restore@v4
      id: cross-cache
      with:
        path: build-temp/toolchain/cross-${{ matrix.arch }}
        key: cross-bionic-${{ matrix.arch }}-${{ hashFiles('scripts/setup-cross-linux-toolchain.sh', 'scripts/build-linux-cross-dependencies.py', format('scripts/sysroots/{0}.lock.json', matrix.arch)) }}
    - name: Build and execute target C++20 probe
      env:
        TARGET: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        mkdir -p build-temp/logs
        docker run -d --name qt-cross-build -v "$PWD:/workspace" -w /workspace ubuntu:18.04 sleep infinity
        docker exec -e GITHUB_TOKEN qt-cross-build \
          bash -ec 'bash scripts/setup-linux-toolchain.sh x64; bash scripts/setup-cross-linux-toolchain.sh "$1"' \
          bash "$TARGET" 2>&1 | tee "build-temp/logs/cross-$TARGET.log"
    - uses: actions/cache/save@v4
      if: always() && steps.cross-deps.outputs.cache-hit != 'true'
      with:
        path: |
          build-temp/toolchain/sysroot-${{ matrix.arch }}
          build-temp/toolchain/downloads
        key: ${{ steps.cross-deps.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: steps.cross-cache.outputs.cache-hit != 'true'
      with:
        path: build-temp/toolchain/cross-${{ matrix.arch }}
        key: ${{ steps.cross-cache.outputs.cache-primary-key }}
    - name: Identify Qt build inputs
      if: inputs.build_sdk
      id: qt-source
      run: |
        qt_modules_hash=$(git ls-tree -r HEAD | awk '$1 == "160000" && $4 ~ /^qt/ {print $3, $4}' | sha256sum | cut -d' ' -f1)
        echo "modules=$qt_modules_hash" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      if: inputs.build_sdk
      id: installed-sdk
      with:
        path: build-temp/installed-sdk/
        key: installed-qt-mips64el-release-0a4c0a2407fb0112ed2617fcb0ca44b09ec4d08113dd118e055f0db09f42617c-da3c2bcb205cab774abcc0740302d9f9c7a8d5d06132a8039054d057ff0da2cf
    - name: Build and verify target Qt SDK
      if: inputs.build_sdk
      env:
        TARGET: ${{ matrix.arch }}
        VARIANT: ${{ inputs.variant }}
        QT_REUSE_INSTALL: ${{ steps.installed-sdk.outputs.cache-hit }}
      run: |
        set -o pipefail
        docker exec qt-cross-build apt-get -o Acquire::Retries=5 install -y --no-install-recommends gdb-multiarch
        docker exec -e QT_REUSE_INSTALL -e QT_CACHE_INSTALL=true qt-cross-build \
          bash scripts/build-linux-cross.sh "$TARGET" "$VARIANT" \
          2>&1 | tee "build-temp/logs/cross-$TARGET-sdk.log"
    - uses: actions/cache/save@v4
      if: always() && inputs.build_sdk && steps.installed-sdk.outputs.cache-hit != 'true' && hashFiles('build-temp/installed-sdk/*.tar') != ''
      continue-on-error: true
      with:
        path: build-temp/installed-sdk/
        key: ${{ steps.installed-sdk.outputs.cache-primary-key }}
    - name: Upload cross toolchain diagnostics
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: diagnostics-cross-${{ matrix.arch }}-${{ inputs.variant }}
        if-no-files-found: ignore
        path: build-temp/logs/
    - name: Remove cross build container
      if: always()
      run: docker rm -f qt-cross-build || true
    - uses: actions/upload-artifact@v4
      if: inputs.build_sdk
      with:
        name: qt5.15.17_linux_${{ matrix.arch }}_${{ inputs.variant }}
        if-no-files-found: error
        path: Output/qt5.15.17_linux_${{ matrix.arch }}*.tar.gz
