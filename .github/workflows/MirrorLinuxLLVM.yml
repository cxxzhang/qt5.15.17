name: Mirror verified Linux LLVM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x64
          runner: ubuntu-22.04
        - arch: arm64
          runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Check original archive and native compiler on glibc 2.17
      env:
        ARCH: ${{ matrix.arch }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        image=$(python3 -c 'import json,os; print(json.load(open("scripts/linux-baseline/targets.json"))["targets"][os.environ["ARCH"]]["image"])')
        docker run --rm -e GITHUB_TOKEN -v "$PWD:/workspace" -w /workspace "$image" bash scripts/linux-baseline/mirror-llvm.sh "$ARCH"
    - uses: actions/upload-artifact@v4
      with:
        name: llvm-mirror-${{ matrix.arch }}
        compression-level: 0
        path: |
          build-temp/llvm-mirror-${{ matrix.arch }}/*.tar.xz
          build-temp/llvm-mirror-${{ matrix.arch }}/*.tar.gz
          build-temp/llvm-mirror-${{ matrix.arch }}/*.txt
          build-temp/llvm-mirror-${{ matrix.arch }}/*.json
  publish:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: llvm-mirror-*
        merge-multiple: true
        path: mirror
    - name: Publish immutable toolchain mirror
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        python3 scripts/linux-baseline/publish-cache.py mirror --source-commit "$COMMIT" --source-run "$RUN_ID" --output published-llvm-inputs.json
    - uses: actions/upload-artifact@v4
      with:
        name: published-llvm-inputs
        path: published-llvm-inputs.json
